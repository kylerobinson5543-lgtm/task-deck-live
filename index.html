<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13151b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Task Deck">
<meta name="apple-mobile-web-app-title" content="Task Deck">
<!-- Home screen: the manifest and icons live next to this file on the public site (web/ in the repository) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Task Deck V1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Task Deck V1. One phone-width column: header (title, Waiting on pile, clock), a demo switcher for whose phone you're on,
   the private My day strip, the card stage, one-line quick add. The Waiting on sheet is a view of open assignments.
   Card kinds: task = card, chore = octagon, moment = pillow. Outline = urgency only. */
:root{
  --bg:#13151b; --surface:#1d2029; --line:#2b2f3a; --text:#e9e7e2; --muted:#8c91a1;
  --task-paper:#f4f1ea; --chore-paper:#e3ebdd; --moment-paper:#f6e3df;
  --ink:#1c1e24; --ink-soft:#5b5f6b; --rule:#d6d1c5; --chip:rgba(28,30,36,.07);
  --later:#e3a63b; --do:#43c283; --team:#9483f2; --agent:#3cb6cc; --slot-in:#0b2328; --urgent:#f0a43a; --pink:#e58aa6; --sun:#f3c25b; --busy:#3a3f4d;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow-x:clip}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}   /* installed on a phone: keep clear of the status bar and the home indicator */
.app{max-width:420px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
.clock{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.25}
.clock b{display:block;color:var(--text);font-size:15px;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:99px;align-self:flex-start}
.tabs button{border:none;background:none;padding:6px 16px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.tabs .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;margin-left:4px}

.team{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.who{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:4px 2px;min-width:56px;color:var(--muted);font-size:11.5px;font-weight:500;border-radius:12px}
.who .av{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--text);font-weight:600;font-size:13px}
.who.home .av,.who.kid .av{border-style:dashed}
.who .n{position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:10.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.who[aria-pressed="true"]{color:var(--text)}
.who[aria-pressed="true"] .av{border-color:var(--do);border-style:solid;box-shadow:0 0 0 3px rgba(67,194,131,.25)}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}
.legend b{color:var(--text);font-weight:600}

.stage{position:relative;height:480px;touch-action:none;user-select:none;-webkit-user-select:none}
.edge{position:absolute;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:opacity .2s;pointer-events:none}
.edge.l{left:-4px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center;margin-left:8px;color:var(--do)}
.edge.r{right:-4px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;margin-right:8px;color:var(--later)}
.stage.holding .edge,.stage.show-when .edge.r{opacity:.12}

/* A card is a wrapper (moves, carries shadow + urgency outline) around a face (paper, shape, content). */
.deck{position:absolute;inset:66px 18px 78px;perspective:900px}
.card{position:absolute;inset:0;will-change:transform;cursor:grab;filter:drop-shadow(0 16px 22px rgba(0,0,0,.45))}
.card.urgent{filter:drop-shadow(2.5px 0 0 var(--urgent)) drop-shadow(-2.5px 0 0 var(--urgent)) drop-shadow(0 2.5px 0 var(--urgent)) drop-shadow(0 -2.5px 0 var(--urgent)) drop-shadow(0 16px 22px rgba(0,0,0,.45))}
.card.dragging{cursor:grabbing}
.card.held .face{box-shadow:inset 0 0 0 3px var(--team)}
.card.held.down .face{box-shadow:inset 0 0 0 3px var(--agent)}
.face{position:absolute;inset:0;overflow:hidden;background:var(--paper);color:var(--ink);border-radius:20px;padding:20px 22px 18px;display:flex;flex-direction:column;gap:9px;--paper:var(--task-paper)}
.card.chore .face{--paper:var(--chore-paper);border-radius:0;padding:15% 26px 13%}
.card.moment .face{--paper:var(--moment-paper);border-radius:0;padding:28px 32px 26px}
.band{margin:-20px -22px 2px;padding:7px 22px;font-size:12px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card.chore .band,.card.moment .band{margin:0;padding:0;background:none!important}
.band.from{background:#e6e1f9;color:#3f348f}
.band.done{background:#d6f1e3;color:#1d6b45}
.band.back{background:#f7e6c4;color:#7a5410}
.band.agent{background:#d3eef3;color:#155f6d}
.band.moment{color:#9a3f5c}
.band.deal{color:#1d6b45}
.band b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;background:currentColor}
.band b span{color:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.tag{padding:3px 9px;border-radius:99px;border:1.5px solid currentColor}
.mins{text-transform:none;letter-spacing:0;font-size:12.5px}
.face h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.08;letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
.card.moment h2{font-family:var(--hand);font-weight:700;font-size:36px;letter-spacing:0;line-height:1}
.why{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--chip);color:var(--ink)}
.why.hot{background:#fbe3bd;color:#6b4407}
.face p{margin:0;color:var(--ink-soft);font-size:14.5px}
.mini{list-style:none;margin:0;padding:0;font-size:14px;display:grid;gap:2px}
.mini li.x{color:var(--ink-soft);text-decoration:line-through}
.mini .more{color:var(--ink-soft);font-size:13px}
.next{margin-top:auto;border-top:1.5px dashed var(--rule);padding-top:10px;font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.next b{color:var(--ink)}
.card.moment .next{border-top-color:rgba(154,63,92,.25)}
.stamps{display:flex;flex-direction:row-reverse;flex:none}
.stamps span{width:28px;height:28px;margin-left:-7px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--paper);border:2px dashed #c9a45e;transform:rotate(var(--r))}
.stamp{position:absolute;top:30%;padding:6px 12px;border:3px solid;border-radius:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;opacity:0;pointer-events:none;background:var(--paper)}
.stamp.do{left:24px;color:var(--do);transform:rotate(-8deg)}
.stamp.done{left:50%;font-size:34px;color:var(--do);transform:translateX(-50%) rotate(-6deg)}

.picker,.dock{position:absolute;left:0;right:0;display:flex;justify-content:center;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none}
.picker{top:0;gap:2px;transform:translateY(-8px)}
.dock{bottom:6px;flex-direction:column;align-items:center;gap:8px;transform:translateY(8px)}
.stage.show-picker .picker,.stage.show-dock .dock{opacity:1;transform:none}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;width:60px;font-size:11.5px;color:var(--muted);transition:transform .15s,color .15s}
.chip .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--text);background:var(--surface);border:2px solid var(--line);transition:background .15s,border-color .15s}
.chip.home .av,.chip.kid .av{border-style:dashed}
.chip.maker .av{box-shadow:0 0 0 3px rgba(227,166,59,.45)}
.chip.on{transform:translateY(-4px) scale(1.12);color:var(--text)}
.chip.on .av{background:var(--team);border-color:var(--team);color:#fff}
.chip.catch{animation:catch .55s ease-out}
@keyframes catch{0%{transform:translateY(-4px) scale(1.12)}30%{transform:translateY(-8px) scale(1.45)}60%{transform:translateY(-3px) scale(.96)}100%{transform:translateY(-4px) scale(1.12)}}
.slot{width:74%;height:12px;border-radius:8px;background:var(--surface);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 2px var(--line);transition:box-shadow .2s,background .2s}
.slot.open{background:var(--slot-in);box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 0 0 2px var(--agent),0 0 24px rgba(60,182,204,.55)}
.agent-label{display:flex;align-items:center;gap:8px;font-size:13px}
.agent-label i{width:10px;height:10px;border-radius:50%;background:var(--agent)}
.agent-label.working i{animation:work .7s ease-in-out infinite alternate}
@keyframes work{to{box-shadow:0 0 0 6px rgba(60,182,204,.25);transform:scale(1.25)}}
.hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:12px;color:var(--muted);transition:opacity .2s,color .2s}
.hint.flash{color:var(--team);font-weight:600}
.stage.holding .hint,.stage.show-dock .hint,.stage.talking .hint{opacity:0}

.whenlist{position:absolute;right:0;top:50%;transform:translate(10px,-50%);z-index:20;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;max-width:78%}
.stage.show-when .whenlist{opacity:1;transform:translate(0,-50%)}
.when{display:flex;align-items:center;gap:9px;padding:9px 14px 9px 10px;border-radius:12px;background:var(--surface);border:1.5px solid var(--later);font-size:13px;font-weight:600;color:var(--text);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.when small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.when .e{font-size:18px}
.when.fit{border-color:var(--do)}
.when.soft{border-color:var(--pink)}

.voice{position:absolute;left:50%;bottom:40px;transform:translate(-50%,8px);z-index:35;width:max-content;max-width:calc(100% - 24px);padding:9px 16px;border-radius:99px;background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.voice.show{opacity:1;transform:translate(-50%,0)}
.nudge{position:absolute;left:10px;right:10px;bottom:10px;z-index:36;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:sheetIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sheetIn{from{transform:translateY(20px);opacity:0}}
.nudge .t{font-weight:600}
.nudge .s{color:var(--muted);font-size:13px}
.nudge .nb{display:flex;gap:8px;flex-wrap:wrap}
.nudge .primary{background:var(--do);border-color:var(--do);color:#08301c}

.empty{position:absolute;inset:0;border:2px dashed var(--line);border-radius:20px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
.empty b{display:block;font-family:var(--display);font-size:22px;color:var(--text);margin-bottom:6px}

/* Quick add */
.qa{display:flex;gap:8px}
.qa input{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text)}
.qa input::placeholder{color:var(--muted)}
.qa input:focus{outline:none;border-color:var(--do)}
.qa button{border-radius:14px;background:var(--do);color:#08301c;border-color:var(--do);padding:0 16px}
.qprev{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px}
.mcard{position:relative;height:118px}
.mcard .card{cursor:default;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.mcard .face{padding:10px 11px;gap:4px}
.mcard .card.chore .face{padding:17% 12px}
.mcard .card.moment .face{padding:14px 14px}
.mcard .face h2{font-size:14px;line-height:1.1}
.mcard .card.moment h2{font-size:19px}
.mcard .meta{font-size:9.5px}
.mcard .tag{padding:1px 6px;border-width:1px}
.mcard .next{font-size:10px;padding-top:4px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{font-size:12.5px;padding:6px 10px;background:var(--bg)}
.qchips button b{font-weight:500;color:var(--muted);margin-right:4px}
.qhint{font-size:12px;color:var(--muted);grid-column:1/-1}

/* Overlays */
.overlay{position:absolute;inset:6px 4px;z-index:40;background:var(--task-paper);color:var(--ink);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 70px rgba(0,0,0,.65);overflow:auto;animation:open .32s cubic-bezier(.2,.9,.3,1.15)}
.overlay.chore{background:var(--chore-paper)}
.overlay.moment{background:var(--moment-paper)}
@keyframes open{from{transform:scale(.88);opacity:0}}
.overlay h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.overlay.moment h2{font-family:var(--hand);font-size:36px;line-height:1}
.overlay .sub{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.overlay p{margin:0;color:var(--ink-soft)}
.qp{border-radius:14px;background:rgba(255,255,255,.65);border:1px solid var(--rule);padding:12px;display:grid;gap:9px}
.qph{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.qlink{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--do);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14.5px}
.qlink small{display:block;font-weight:500;color:var(--ink-soft);font-size:12px}
.qlink:focus-visible{outline:2px solid var(--team);outline-offset:2px}
.qready{display:flex;flex-wrap:wrap;gap:6px}
.qready span{font-size:12.5px;padding:4px 9px;border-radius:99px;background:var(--chip);color:var(--ink)}
.qtip{font-size:13.5px;color:var(--ink-soft);display:flex;gap:7px}
.qagent{justify-self:start;background:#fff!important;color:var(--ink)!important;border:1.5px solid var(--agent)!important}
.check{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.check button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:15px}
.check button:hover{background:rgba(28,30,36,.06)}
.check button:focus-visible{outline:2px solid var(--team)}
.check .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-soft);display:grid;place-items:center;font-size:13px;flex:none}
.check .x .box{background:var(--do);border-color:var(--do);color:#fff}
.check .x .t{text-decoration:line-through;color:var(--ink-soft)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--rule);background:#fff;color:var(--ink)}
.actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}
.actions button,.overlay .pbtn{background:#fff;color:var(--ink);border:1.5px solid var(--rule)}
.actions .primary{background:var(--do);border-color:var(--do);color:#08301c}
.actions .primary:disabled{opacity:.45;cursor:default}
.actions .warn{background:#fff;border-color:var(--later);color:#7a5410}
.actions .quiet{border-color:transparent;background:none;color:var(--ink-soft)}
.cam{display:grid;place-items:center;gap:6px;border:2px dashed var(--ink-soft);border-radius:16px;min-height:180px;cursor:pointer;color:var(--ink-soft);font-weight:600;overflow:hidden;position:relative;background:rgba(28,30,36,.04)}
.cam input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cam img{width:100%;height:220px;object-fit:cover;display:block}
.cam:focus-within{outline:2px solid var(--team);outline-offset:2px}
.decide-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.decide-grid button{background:#fff;color:var(--ink);border:1.5px solid var(--rule);border-radius:14px;padding:12px;text-align:left;display:grid;gap:2px}
.decide-grid button small{font-weight:500;color:var(--ink-soft)}
.decide-grid .primary{background:var(--do);border-color:var(--do);color:#08301c}
.decide-grid .primary small{color:#165b37}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13.5px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Undo: a short-lived bar after every action */
.undobar{position:fixed;left:50%;bottom:20px;z-index:55;transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;
  max-width:calc(100% - 32px);padding:8px 8px 8px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5);font-size:13.5px;transition:opacity .2s,transform .25s;overflow:hidden}
.undobar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.undobar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undobar button{background:var(--text);color:var(--bg);border-color:var(--text);padding:6px 14px;flex:none}
.undobar i{position:absolute;left:0;bottom:0;height:2px;background:var(--do);width:100%}
.undobar.show i{animation:drain linear forwards;animation-duration:var(--t,6s)}
@keyframes drain{to{width:0}}
.toast{bottom:76px}
/* Edit sheet (inside the workspace) */
.editbtn{position:absolute;top:14px;right:14px;background:#fff!important;color:var(--ink)!important;border:1.5px solid var(--rule)!important;font-size:12.5px;padding:5px 11px}
.ef{display:grid;gap:12px}
.ef label{display:grid;gap:5px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.ef input,.ef textarea,.ef select{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:9px 11px;min-width:0}
.ef textarea{min-height:64px;resize:vertical}
.ef input:focus,.ef textarea:focus,.ef select:focus{outline:none;border-color:var(--do)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{background:#fff;color:var(--ink);border:1.5px solid var(--rule);font-size:13px;padding:5px 11px;text-transform:none;letter-spacing:0}
.pills button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ef .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Waiting on: a small fanned pile in the header; tap to spread the cards */
.waitpile{display:flex;align-items:center;gap:9px;background:none!important;border:none!important;padding:4px 2px!important;color:var(--muted);font-size:12.5px;font-weight:600;margin-left:auto}
.waitpile .fan{position:relative;width:34px;height:30px}
.waitpile .fan i{position:absolute;left:8px;top:2px;width:18px;height:24px;border-radius:4px;background:var(--task-paper);box-shadow:0 2px 4px rgba(0,0,0,.4);transform-origin:50% 90%}
.waitpile .fan i:nth-child(1){transform:rotate(-16deg);opacity:.75}
.waitpile .fan i:nth-child(2){transform:rotate(-2deg);opacity:.9}
.waitpile .fan i:nth-child(3){transform:rotate(13deg)}
.waitpile .fan i.agent{background:#d3eef3}

.scrim{position:fixed;inset:0;background:rgba(8,9,12,.62);z-index:50;animation:fadeIn .2s}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:452px;margin:0 auto;max-height:84vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:10px 16px 26px;animation:sheetUp .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
.sheet .sub{font-size:13px;color:var(--muted);margin:2px 0 14px}
.wlist{display:grid;gap:12px}
.wcard{position:relative;background:var(--task-paper);color:var(--ink);border-radius:16px;padding:12px 14px;display:grid;gap:6px;box-shadow:0 10px 22px rgba(0,0,0,.4);animation:dealIn .38s cubic-bezier(.2,.9,.3,1.25) both}
.wcard.chore{background:var(--chore-paper);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
@keyframes dealIn{from{transform:translateY(-26px) rotate(-3deg);opacity:0}}
.wcard .wtop{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.wcard b{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15}
.wstate{justify-self:start;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--chip)}
.wstate.not_sent{background:#d3eef3;color:#155f6d}
.wstate.seen{background:#e6e1f9;color:#3f348f}
.wstate.needs_info{background:#fbe3bd;color:#6b4407}
.wact{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.wact button{background:#fff;color:var(--ink);border:1.5px solid var(--rule);font-size:12.5px;padding:6px 12px}
.wact button.warn{border-color:var(--later);color:#7a5410}

.wempty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}
.band.review{background:#d6f1e3;color:#1d6b45}
.band.parked{background:#d3eef3;color:#155f6d}
/* Welcome / sign-in (signed out, or signed in without a family yet) */
.welcome{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:420px;margin:0 auto;padding:32px 20px}
.welcome h1{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.02em;margin:0}
.welcome .tag{color:var(--muted);font-size:15px;margin:-10px 0 6px}
.welcome .wbtns{display:grid;gap:10px}
.welcome .wbtns button{padding:13px 16px;font-size:15px;border-radius:14px;text-align:left}
.welcome .wbtns button.primary{background:var(--do);border-color:var(--do);color:#08301c}
.welcome .wbtns button small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.welcome .wbtns button.primary small{color:#1d6b45}
.welcome .cform{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.welcome .cform h3{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:19px}
.welcome .cform .hint{color:var(--muted);font-size:13px;margin:0 0 4px}
.welcome .foot{color:var(--muted);font-size:12.5px}
.welcome .signed{font-size:13px;color:var(--muted)}
body[data-mode="family"] .bar{display:none}
body[data-mode="family"] .team .who{cursor:default}
.demo-note{font-size:12.5px;color:var(--muted);text-align:center}
.fam{display:grid;gap:10px}
.fam .member{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.fam .member .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);font-weight:600;font-size:13px}
.fam .member.kid .av{border-style:dashed}
.fam .member b{display:block;font-size:15px}
.fam .member small{color:var(--muted);font-size:12px}
.fam .member .acts{display:flex;gap:6px}
.fam .member .acts button{font-size:12px;padding:5px 10px}
.fam .code{background:var(--surface);border:1px dashed var(--agent);border-radius:14px;padding:12px;text-align:center}

/* Cloud connection (Grok Bot) */
.cloudbtn{display:flex;align-items:center;gap:6px;padding:5px 10px!important;font-size:15px;line-height:1}
.cloudbtn i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.cloudbtn.on i{background:var(--agent);box-shadow:0 0 8px rgba(60,182,204,.75)}
.cform{display:grid;gap:10px}

.sheet .actions{margin-top:4px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13.5px;font-weight:600}
.checks .ok{color:#1d6b45}
.checks .bad{color:#9a3f2c}
.wstate.sent{background:#d3eef3;color:#155f6d}
.wstate.delivery_failed{background:#fbe3bd;color:#6b4407}

/* My day (private) */
.myday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.myday summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px}

.myday .wkbars .clean i{box-shadow:0 0 0 2px var(--sun)}
.myday .recap{font-size:12.5px;color:var(--muted);margin-top:8px}
.burst{position:absolute;left:50%;top:45%;z-index:45;pointer-events:none;font-size:24px}
.burst span{position:absolute;animation:burst 1.1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.dcard{transition:none!important}.burst{display:none}}

.bar{display:flex;flex-wrap:wrap;gap:8px}
.bar .lbl{width:100%;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.log h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.log ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;min-width:0}

button{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer}
button:focus-visible,.mc:focus-visible,.wrow:focus-visible{outline:2px solid var(--team);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.overlay,.nudge{animation:none}}
</style>
</head>
<body>
<div class="welcome" id="welcome" hidden></div>
<div class="app" id="app" hidden>
  <header>
    <h1>Task Deck</h1>
    <button type="button" class="waitpile" id="waitBtn" aria-haspopup="dialog"></button>
    <button type="button" class="cloudbtn" id="cloudBtn" aria-haspopup="dialog" aria-label="Account"><i></i>🤖</button>
    <div class="clock" id="clock"></div>
  </header>
  <div class="team" id="team" aria-label="Your household"></div>

  <section id="deckView" style="display:flex;flex-direction:column;gap:14px">
    <details class="myday" id="myday"></details>
    <div class="legend">
      <span><i style="background:var(--do)"></i><b>Swipe left</b>&nbsp;Do it</span>
      <span><i style="background:var(--later)"></i><b>Swipe right</b>&nbsp;Not now</span>
      <span><i style="background:var(--team)"></i><b>Swipe up</b>&nbsp;Hand off</span>
      <span><i style="background:var(--agent)"></i><b>Swipe down</b>&nbsp;Agent</span>
    </div>
    <div class="stage" id="stage">
      <div class="picker" id="picker"></div>
      <span class="edge l">Do it</span>
      <span class="edge r">Not now</span>
      <div class="deck" id="deck"></div>
      <div class="whenlist" id="whenlist"></div>
      <div class="hint" id="hint">Swipe right and the app finds a time</div>
      <div class="voice" id="voice" role="status" aria-live="polite"></div>
      <div class="dock"><div class="slot" id="slot"></div><div class="agent-label" id="agentLabel"><i></i>Grok Bot</div></div>
      <div class="nudge" id="nudge" hidden>
        <div><div class="t" id="nudgeT"></div><div class="s" id="nudgeS"></div></div>
        <div class="nb"><button type="button" class="primary" id="nDo">Do it now</button><button type="button" id="nLater">Later anyway</button></div>
      </div>

    </div>
    <form class="qa" id="qa" autocomplete="off">
      <input id="qaIn" aria-label="Add a card in one line" placeholder="Add a card…">
      <button type="submit">Add</button>

    <button type="button" id="skipDay">Skip to tomorrow</button>
    <button type="button" id="reset">Start over</button>
  </div>

  <section class="log">
    <h3>Family activity</h3>
    <ul id="log"></ul>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="undobar" id="undoBar" role="status" aria-live="polite"><span id="undoTxt"></span><button type="button" id="undoBtn">Undo</button><i></i></div>
<div id="waitLayer" hidden><div class="scrim" id="waitScrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="waitH" id="waitSheet"></div></div>
<div id="cloudLayer" hidden><div class="scrim" id="cloudScrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cloudH" id="cloudSheet"></div></div>
<div id="famLayer" hidden><div class="scrim" id="famScrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="famH" id="famSheet"></div></div>

<script>
let STORE='taskdeck.v1';
/* ---------- Modes and people ----------
   'welcome' = signed out · 'demo' = the sample family on one device (design reviews) · 'family' = a signed-in household.
   A person is always referred to by a stable key: in family mode the server's person id, in the demo the sample name.
   Names are never stored on cards; nm(key) renders the name THIS viewer uses for that person ("Mom" for a child,
   "Ashley" for Kyle), from the household's explicit name labels. */
let mode='welcome';
const DEMO_PEOPLE=[{id:'Kyle',n:'Kyle',i:'K',g:'me',role:'parent'},{id:'Ashley',n:'Ashley',i:'As',g:'home',role:'parent'},{id:'Myla',n:'Myla',i:'My',g:'kid',role:'kid'},{id:'Kuhlly',n:'Kuhlly',i:'Ku',g:'kid',role:'kid'},{id:'Shelie',n:'Shelie',i:'Sh',g:'home',role:'relative'},{id:'Cindy',n:'Cindy',i:'Ci',g:'home',role:'relative'}];
let people=DEMO_PEOPLE;
const person=k=>people.find(p=>p.id===k)||{id:k,n:String(k),i:String(k).slice(0,2),g:'agent',role:'agent'};
const nm=k=>{const p=people.find(p=>p.id===k);return p?p.n:String(k)};
const isKid=k=>person(k).role==='kid',isParent=k=>person(k).role==='parent';
const kidKeys=()=>people.filter(p=>p.role==='kid').map(p=>p.id),parentKeys=()=>people.filter(p=>p.role==='parent').map(p=>p.id);
// AI agents: a parent's execution agent is Grok Bot (family mode, signed in). Only the handshake probe is wired to it.
const agentOf=k=>isParent(k)?'Grok Bot':'your assistant';
const PH={5:['🌅','Bright and early'],6:['🌄','At the crack of dawn'],7:['☕','With my morning coffee'],8:['💼','Before the workday begins'],
  9:['🏢','First thing at work'],10:['🎯','Mid-morning mission'],11:['🔔','Before the lunch bell'],12:['🌮','Lunch o’clock'],
  13:['🍽️','Right after lunch'],14:['🌤️','Early afternoon'],15:['🍩','Afternoon pick-me-up'],16:['🏃','The afternoon home stretch'],
  17:['🏁','When the whistle blows'],18:['🍲','Around the dinner table'],19:['🧽','After the dinner dishes'],20:['🛋️','When the evening settles in'],
  21:['🤫','Once the house gets quiet'],22:['🛏️','Before hitting the hay']};
const PH_WEEKEND={8:['🥞','Slow weekend breakfast'],9:['🧺','Weekend morning chores'],17:['🌇','Late-afternoon wind-down']};

/* ---------- Clock. Saved state keeps its own day zero so dates stay put across visits. ---------- */
const DAY=1440,WAKE=5*60,SLEEP=22*60,DECIDE_AT=3,DEAL_AT=930,CAP=4;
let BASE=new Date();BASE.setHours(0,0,0,0);
const EPOCH=new Date(2026,0,1);   // family mode: every phone counts days from the same midnight, so a card's dates mean the same thing everywhere
let now=0;
const nowDay=()=>Math.floor(now/DAY),tod=()=>((now%DAY)+DAY)%DAY;
const dateOf=d=>{const x=new Date(BASE);x.setDate(x.getDate()+d);return x};
const dayOfDate=dt=>Math.round((new Date(dt.getFullYear(),dt.getMonth(),dt.getDate())-BASE)/864e5);
const dow=d=>dateOf(d).getDay();
const isWeekend=d=>[0,6].includes(dow(d));
const dayName=d=>dateOf(d).toLocaleDateString([],{weekday:'long'});
const shortDay=d=>dateOf(d).toLocaleDateString([],{weekday:'short'});
const fmt=m=>{m=((m%DAY)+DAY)%DAY;const h=Math.floor(m/60),mm=m%60;return `${(h%12)||12}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`};
const fmtShort=m=>{const h=Math.floor(m/60),mm=m%60;return `${(h%12)||12}${mm?':'+String(mm).padStart(2,'0'):''}${h<12?'a':'p'}`};
const phrase=(d,h)=>{h=Math.min(22,Math.max(5,h));return(isWeekend(d)&&PH_WEEKEND[h])||PH[h]};
const realNow=()=>Math.floor((Date.now()-BASE.getTime())/60000);

/* ---------- Schedules (sample calendars) ---------- */
const SCHED={
  Ashley:{wd:[[480,930,'Work'],[945,975,'School pickup'],[1110,1155,'Family dinner']],we:[[600,660,'Yoga'],[1110,1155,'Family dinner']]},
  Myla:{wd:[[465,915,'School'],[1110,1155,'Family dinner']],we:[[1110,1155,'Family dinner']]},
  Kuhlly:{wd:[[465,915,'School'],[1110,1155,'Family dinner']],we:[[540,630,'Game'],[1110,1155,'Family dinner']]},
  Shelie:{wd:[[600,690,'Book club'],[960,1020,'Evening walk']],we:[[540,630,'Farmers market']]},
  Cindy:{wd:[[540,720,'Volunteering']],we:[[720,780,'Lunch with friends']]}};
// Kyle's sample days are full on purpose (an advisor's day), so the narrow open pockets show
const KA=[[330,375,'Gym'],[405,435,'Breakfast with the kids'],[450,480,'School drop-off'],[510,540,'Team huddle'],[540,600,'Client review'],[615,645,'Prospect call'],[660,690,'Paperwork block'],[705,750,'Lunch with Ashley'],[765,810,'Client review'],[825,855,'Office check-in'],[870,930,'Client meeting'],[945,975,'Pick up Kuhlly'],[990,1020,'Drive home'],[1035,1080,'Kuhlly’s practice'],[1095,1140,'Family dinner'],[1170,1200,'Homework help'],[1230,1260,'Bedtime routine']];
const KB=[[330,375,'Gym'],[420,480,'Breakfast and drop-off'],[510,570,'Client review'],[600,660,'Planning session'],[690,735,'Lunch'],[780,870,'Client meetings'],[900,930,'Calls'],[960,990,'School pickup'],[1050,1110,'Myla’s volleyball'],[1110,1155,'Family dinner'],[1200,1230,'Bedtime routine']];
const KC=[[480,540,'Pancake breakfast'],[540,630,'Boys’ game'],[720,780,'Errands'],[900,960,'Yard work'],[1080,1140,'Family dinner'],[1230,1260,'Bedtime routine']];
const kyleDay=d=>isWeekend(d)?KC:(((d%2)+2)%2?KB:KA);
let extras=[]; // one-off calendar events: {n,day,s,e,t,away}
const events=(n,d)=>(n==='Kyle'?kyleDay(d):((SCHED[n]||{})[isWeekend(d)?'we':'wd']||[])).map(([s,e,t])=>({s,e,t}))
  .concat(extras.filter(x=>x.n===n&&x.day===d).map(x=>({s:x.s,e:x.e,t:x.t,away:x.away}))).sort((a,b)=>a.s-b.s);
const RULES={anytime:{lbl:'Anytime',from:WAKE,to:SLEEP},business:{lbl:'Business hours',from:540,to:1020,weekdays:true},errand:{lbl:'Store hours',from:480,to:1200},daylight:{lbl:'Daylight',from:480,to:1110}};
function guessRule(t){t=t.toLowerCase();
  if(/\b(rake|mow|leaves|yard|garden|shovel|wash the car)\b/.test(t))return'daylight';
  if(/\b(call|book|dentist|doctor|appointment|bank|insurance|schedule)\b/.test(t))return'business';
  if(/\b(pick up|return|drop off|buy|store|errand|dry cleaning)\b/.test(t))return'errand';return'anytime'}
function guessMins(t){t=t.toLowerCase();
  const R=[[/renew|pay|send|text|email|sign|trash|counters|set the table|feed/,5],[/call|book|review|order|unload|dishwasher|clear|wipe|pick up the|filter/,10],[/pick up|return|drop|sweep|fold|laundry|vacuum/,20],[/plan|clean|organize|fix|mow|rake/,30],[/compare|research|write/,45]];
  for(const[r,m]of R)if(r.test(t))return m;return 15}

/* ---------- Repeats in plain words ---------- */
const DOW_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function occursOn(rep,d){
  if(!rep||d<rep.start)return false;
  if(rep.type==='weekly'){
    if(!rep.days.includes(dow(d)))return false;
    return (rep.interval||1)===1||Math.floor((d-rep.start)/7)%rep.interval===0;
  }
  if(rep.type==='monthly'){
    const dt=dateOf(d),s=dateOf(rep.start);
    if(dt.getDate()!==Math.min(rep.dom,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()))return false;
    const months=(dt.getFullYear()-s.getFullYear())*12+dt.getMonth()-s.getMonth();
    return months%(rep.interval||1)===0;
  }
  return false;
}
function nextOcc(rep,from){for(let d=from;d<from+400;d++)if(occursOn(rep,d))return d;return null}
function repLabel(rep){
  if(!rep)return'';
  const at=rep.at!=null?` · ${timeWord(rep.at)}`:'';
  if(rep.type==='monthly'){const n=rep.dom,suf=n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th';
    return(rep.interval>1?`Every ${rep.interval} months on the ${n}${suf}`:`The ${n}${suf} of every month`)+at}
  const ds=rep.days.slice().sort((a,b)=>a-b),k=ds.join();
  let base=k==='0,1,2,3,4,5,6'?'Every day':k==='1,2,3,4,5'?'Weekdays':k==='0,6'?'Weekends':(rep.interval>1?'Every other ':'Every ')+ds.map(x=>DOW_NAMES[x]).join(' & ');
  return base+at;
}
function timeWord(m){return m<720?'morning':m<900?'midday':m<1020?'after school':m<1260?'evening':'night'}

/* ---------- Quick paths ---------- */
const QP={
  registration:{links:[
      {label:'Renew online',note:'Michigan Secretary of State · Quick Renewal',url:'https://dsvsesvc.sos.state.mi.us/TAP/?Link=VehicleRenewal'},

const poolFor=d=>pool.filter(p=>occursOn(p.rep,d));

  chs.slice().sort((a,b)=>b.mins-a.mins).forEach(ch=>{
    // Even counts first, then fewest minutes this week (weighted by the split), then avoid repeating yesterday's chore
    let cand=kids.filter(k=>count[k]<cap);
    if(!cand.length){skipped.push(ch);return}
    const low=Math.min(...cand.map(k=>count[k]));cand=cand.filter(k=>count[k]===low);
    const score=k=>(weekMins(k)+load[k])/(share[k]||.5)+(prev[ch.id]===k?40:0);

    const k=cand[0];load[k]+=ch.mins;count[k]++;hist[d][ch.id]=k;

  // Every dealt chore done = a clean day for that kid. Weekends never count against them.
  Object.keys(dealt).map(Number).filter(p=>p<d).forEach(p=>kidKeys().forEach(k=>{const key=k+'@'+p;if(dayLog[key])return;
    const had=Object.values(hist[p]||{}).includes(k);dayLog[key]=!had?'out':stale.some(c=>c.holder===k&&c.dealt===p)?(isWeekend(p)?'skip':'miss'):'clean'}));

  const load={},count={};kids.forEach(k=>{load[k]=0;count[k]=0});

  const load={},count={};kids.forEach(k=>{load[k]=cards.filter(c=>c.dealt===d&&c.holder===k).reduce((a,c)=>a+c.mins,0);count[k]=cards.filter(c=>c.dealt===d&&c.holder===k).length});

  addLog('var(--do)',`🎲 ${nm(kid)}’s out tonight. Re-dealt ${mine.length-skipped.length} to ${kids.map(nm).join(' & ')}${skipped.length?`, ${skipped.length} skipped`:''}.`);

function roundPoly(pts,r){

/* ---------- Undo ----------
   Every action can be undone for a few seconds. Undo restores the card, but anything already delivered
   to another person or an agent is not silently erased: that assignment stays on the card as "cancelled"
   and the activity log says it was undone. */
const UNDO_MS=6000;let undoRec=null,undoT=0,wsRedraw=null;
function snapUndo(c,act,label){

    ledgerLen:ledger.length,stats:JSON.parse(JSON.stringify(stats)),act,label,by:viewer,ready:false};
}
function showUndo(){
  if(!undoRec||undoRec.ready)return;undoRec.ready=true;
  const bar=$('undoBar');$('undoTxt').textContent=undoRec.label;bar.style.setProperty('--t',UNDO_MS+'ms');
  bar.classList.remove('show');void bar.offsetWidth;bar.classList.add('show');
  clearTimeout(undoT);undoT=setTimeout(hideUndo,UNDO_MS);
}
function hideUndo(){$('undoBar').classList.remove('show');undoRec=null;clearTimeout(undoT)}
function undo(){
  const u=undoRec;if(!u||!u.ready||u.by!==viewer||(busy&&u.act!=='edit'))return;hideUndo();
  const live=cards.find(x=>x.id===u.id)||archive.find(x=>x.id===u.id);
  // Assignments the action created or moved forward, before we restore the card
  const added=live?(live.asg||[]).slice(u.snap.asg.length):[],changed=live?(live.asg||[]).slice(0,u.snap.asg.length).filter((a,i)=>a.state!==u.snap.asg[i].state):[];
  const createdOthers=cards.filter(x=>!u.ids.has(x.id)&&x.id!==u.id);
  cards=cards.filter(x=>u.ids.has(x.id)||x.id===u.id);
  {const i=archive.findIndex(x=>x.id===u.id);if(i>=0)archive.splice(i,1)}
  const v=live?live.version:u.snap.version;
  let c=cards.find(x=>x.id===u.id);
  if(c){for(const k of Object.keys(c))delete c[k];Object.assign(c,u.snap)}else{c=u.snap;cards.splice(Math.min(u.idx<0?cards.length:u.idx,cards.length),0,c)}
  // Delivered hand-offs stay on the record as cancelled, never erased. A hand-off that reached the server is cancelled there too.
  added.forEach(a=>c.asg.push({...a,state:'cancelled',updated:now,undone:true}));
  added.filter(a=>a.cloudId).forEach(a=>cloudOp('cancel',{assignment_id:a.cloudId}).catch(()=>{}));
  if(added.some(a=>a.kind==='agent'))delete c.cloud;
  c.version=v;touch(c);
  ledger.length=Math.min(ledger.length,u.ledgerLen);stats=u.stats;fresh.add(c.id);
  const delivered=added.filter(a=>a.state!=='not_sent').length||changed.length||createdOthers.some(x=>x.holder!==viewer);
  addLog('var(--muted)',`↩ ${nm(viewer)} undid: ${u.label}${delivered?' (the hand-off is cancelled, not erased)':''}`);
  toast('Undone');
  if(busy&&u.act==='edit'&&!overlay.hidden&&wsRedraw){save();wsRedraw()}else render();
}

async function waitAction(act,id){

  if(act==='refresh'){try{await syncProbe();toast('Up to date')}catch(e){toast('Couldn’t reach the server')}render();return}
  if(act==='resend'){
    if(!a.cloudId){cloudSend(c,a);render();return}                    // never got created on the server: start over
    c.cloud.sending=true;c.cloud.error=null;render();
    try{const r=await cloudOp('dispatch',{assignment_id:a.cloudId,redeliver:true});c.cloud.sending=false;
      addLog('var(--agent)',r.accepted?`🤖 Sent “${c.t}” to ${nm(a.to)} again · run started`:`⚠ ${nm(a.to)} didn’t accept “${c.t}” (HTTP ${r.http_status??'—'})`);
      toast(r.accepted?`${nm(a.to)} started a new run`:`Not accepted (HTTP ${r.http_status??'no reply'})`);await syncProbe()}

  if(act==='nudge'){c.nudge={by:viewer,at:now};touch(c);addLog('var(--team)',`👋 ${nm(viewer)} nudged ${nm(c.holder)} about “${c.t}”`);toast(`Nudged ${nm(c.holder)}. It moves up in their deck.`)}

  }

    if(!r.ok)return false;auth=sessionOf(await r.json());saveAuth();return true}catch(e){return false}

async function cloudFetch(path,opts,retry=true){
  if(!auth)throw new Error('sign_in_required');
  if(auth.expires_at&&auth.expires_at*1000<Date.now()+60000)await refreshAuth();
  const r=await fetch(cloudPath(path),{...opts,headers:{...hdr(true),...(opts.headers||{})}});
  if(r.status===401&&retry&&await refreshAuth())return cloudFetch(path,opts,false);
  if(r.status===401){signOutLocal();if(mode==='family')leaveToWelcome();throw new Error('sign_in_required')}
  if(r.status===403)throw Object.assign(new Error('not_allowed'),{status:403});   // a function this login may not call
  const text=await r.text();let body;try{body=JSON.parse(text)}catch(e){body={raw:text}}
  if(!r.ok)throw Object.assign(new Error((body&&(body.error||body.message||body.msg))||('HTTP '+r.status)),{status:r.status,body});

// Mirror the server's view of the probe onto the local card. The server is authoritative; the card follows it.
async function syncProbe(opts){
  if(!auth||syncing)return null;syncing=true;
  try{
    const s=await cloudRpc('td_assignment_status',{p_ref:CLOUD.ref});
    const a=s&&s.found?s.assignment:null;

    if(a){
      const live=LIVE_STATES.includes(a.state);

      if(loc||live){
        if(!c)c=ensureProbeCard();

        c.cloud={asgId:a.id,taskId:s.task&&s.task.id,state:a.state,version:a.version,blocker:a.blocker,result:s.result,deliveries:s.deliveries||[],events:s.events||[],

          if(changed&&a.state==='returned'){fresh.add(c.id);c.handedAt=now;addLog('var(--agent)',`🤖 ${CLOUD.agent} finished “${c.t}” · ${checksWord(s.result)} · your review`)}
          else if(changed&&a.state==='seen')addLog('var(--agent)',`🤖 ${CLOUD.agent} acknowledged “${c.t}”`);
          else if(changed&&a.state==='needs_info')addLog('var(--later)',`🤖 ${CLOUD.agent} has a question about “${c.t}”: ${a.blocker||''}`);
          else if(changed&&a.state==='delivery_failed')addLog('var(--later)',`⚠ Delivery of “${c.t}” to ${CLOUD.agent} failed`);
        }else if(a.state==='accepted'&&cards.includes(c)){archiveCard(c,'done');addLog('var(--do)',`✓ “${c.t}” is accepted on the server`)}
        else if(['cancelled','declined','reopened'].includes(a.state)&&cards.includes(c)&&c.holder!==meKey()){c.holder=meKey();c.status='open';c.doneBy=null;addLog('var(--muted)',`“${c.t}” was cancelled on the server · back in ${meKey()}’s deck`)}
        touch(c);
      }

  }finally{syncing=false}
}
function schedulePoll(ms){clearTimeout(pollT);if(auth)pollT=setTimeout(pollProbe,ms)}
async function pollProbe(){

  if(live&&document.visibilityState==='visible'){

// Send the probe: create (idempotent) then dispatch. Undo or a take-back meanwhile cancels it on the server.
async function cloudSend(c,a){
  const gone=()=>!cards.includes(c)||!(c.asg||[]).includes(a)||a.state==='cancelled';
  c.cloud=Object.assign(c.cloud||{},{sending:true,error:null});
  try{
    const r1=await cloudOp('create_probe',{task_id:c.id});
    const srv=r1.assignment;if(!srv||!srv.id)throw new Error('no assignment returned');
    a.cloudId=srv.id;
    if(gone()){cloudOp('cancel',{assignment_id:srv.id}).catch(()=>{});return}
    c.cloud=Object.assign(c.cloud,{asgId:srv.id,taskId:r1.task&&r1.task.id,state:srv.state,version:srv.version,at:Date.now()});
    const r2=await cloudOp('dispatch',{assignment_id:srv.id});
    if(gone()){cloudOp('cancel',{assignment_id:srv.id}).catch(()=>{});return}
    const st=r2.state||(r2.accepted?'sent':'delivery_failed');
    setState(a,st);Object.assign(c.cloud,{state:st,version:r2.version??c.cloud.version,http:r2.http_status??null,sending:false});touch(c);
    if(r2.skipped)addLog('var(--agent)',`“${c.t}” was already with ${CLOUD.agent} (${st})`);
    else if(r2.accepted){addLog('var(--agent)',`🤖 Sent “${c.t}” to ${CLOUD.agent} · run started`);say(`${CLOUD.agent} started a run. Watch Waiting on.`,'info')}
    else{addLog('var(--later)',`⚠ ${CLOUD.agent} didn’t accept “${c.t}” (HTTP ${r2.http_status??'no reply'})`);say(`Delivery failed (HTTP ${r2.http_status??'no reply'}). Try again from Waiting on.`,'info')}
  }catch(e){
    if(gone())return;
    Object.assign(c.cloud,{error:e.message||'network error',sending:false});touch(c);
    addLog('var(--later)',`⚠ Couldn’t send “${c.t}” to ${CLOUD.agent}: ${e.message||'network error'}`);
    say(e.message==='sign_in_required'?'Signed out. Sign in again to send it.':'Couldn’t reach the server. It’s in Waiting on; try again there.','info');
  }
  if(!busy)render();schedulePoll(1500);
}

  const k=r.checks||{},names={ack_text:'Acknowledgment text matches',assignment_id:'Assignment id matches',challenge:'Challenge echoed back',challenge_reversed:'Challenge reversed correctly',sum:'Numbers summed correctly'};

   me/household/labels come from td_me() (row-level security: a person sees only their own household).
   people is rebuilt from that as THIS viewer sees it: p.n is the label the viewer uses for p, else p's display name. */
let me=null,household=null,labels={},relationships=[];
function peopleFromServer(sv){
  const mine=(sv.labels||{})[sv.person.id]||{};
  return sv.members.filter(p=>p.active).map(p=>({id:p.id,n:mine[p.id]||p.display_name,i:p.initials,g:p.id===sv.person.id?'me':p.role==='kid'?'kid':'home',
      role:p.role,admin:!!p.is_admin,age:p.age_class,linked:!!p.linked,display_name:p.display_name,birth_year:p.birth_year,version:p.version}))
    .sort((a,b)=>(a.id===sv.person.id?-1:b.id===sv.person.id?1:0));

async function loadMe(){

  if(!sv||!sv.person){me=null;household=null;labels={};relationships=[];return null}
  me=sv.person;household=sv.household;labels=sv.labels||{};relationships=sv.relationships||[];people=peopleFromServer(sv);

/* ---------- Shared cards (R1.2) and real hand-offs (R1.3) ----------
   In family mode the household's cards live on the server, one row per card (td_card_put / td_cards_sync), and every
   phone keeps its own copy. The server shows a phone only the cards that involve its person (maker, holder, anyone in
   the hand-off history), so two adults' private cards stay private and nothing reaches a child that isn't theirs.
   Every change a phone makes is pushed with the server version it was based on; a stale push is refused and the
   server's copy wins on this phone. Every few seconds while the app is open (and whenever it comes back to the
   front) the phone pulls what changed since its last pull: a card handed to you lands in your deck with a note;
   a card you handed off shows Seen, Done, or comes back for your review. The handshake probe is not a shared
   card: it stays on its Stage 1 path. */
const freshSync=()=>({since:null,known:{},err:null,at:0});   // known[id] = {v: server version (0 = not there yet), j: the copy the server confirmed}
let sync=freshSync(),syncT=0,syncBusy=false;
const syncable=c=>!c.probe&&c.src!=='probe';
const shared=c=>{const o={};for(const k in c)if(k!=='cloud'&&k[0]!=='_'&&c[k]!==undefined)o[k]=c[k];return o};
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);   // same bytes for the same card, whatever the key order
function scheduleSync(ms){clearTimeout(syncT);if(auth&&mode==='family'&&me)syncT=setTimeout(syncTick,ms)}
async function syncTick(){
  if(mode!=='family'||!auth||!me)return;
  if(document.visibilityState!=='visible')return scheduleSync(30000);
  if(busy||syncBusy)return scheduleSync(1500);                         // never change cards under a gesture
  syncBusy=true;let changed=false,woke=false;
  try{
    const d0=nowDay();now=Math.max(now,realNow());if(nowDay()!==d0)closeDays(d0,nowDay());   // the family clock is the real clock
    if(cards.some(c=>c.slot&&c.slot.day*DAY+c.slot.start<=now)){wakeCards();woke=true}
    await syncPush();
    changed=await syncPull();
    sync.err=null;sync.at=Date.now();
    {const live=new Set(cards.concat(archive).map(c=>c.id));for(const id in sync.known)if(!live.has(id))delete sync.known[id]}   // forget cards the archive has let go of
  }catch(e){if(e.message!=='sign_in_required')sync.err=e.message||'network'}
  finally{syncBusy=false}
  if(mode!=='family')return;
  if((changed||woke)&&!busy)render();else{renderClock();save()}
  scheduleSync(6000);                                                 // after render → save → scheduleSync(700): this one wins
}
// Push every card that differs from the copy the server last confirmed. Finished cards are pushed only if the
// server already knew them (a card created and dropped on one phone never leaves it).
async function syncPush(){
  for(const c of cards.concat(archive.filter(c=>sync.known[c.id]))){
    if(!syncable(c))continue;
    const j=canon(shared(c)),k=sync.known[c.id];
    if(k&&k.j===j)continue;
    const r=await cloudRpc('td_card_put',{p_card:JSON.parse(j),p_expected_version:k?k.v:0});
    if(r&&r.ok){sync.known[c.id]={v:r.version,j};continue}
    if(r&&r.error==='stale'){applyServer({id:c.id,version:r.version,card:r.card,by:r.by},'stale');continue}
    sync.known[c.id]={v:k?k.v:0,j,err:(r&&r.error)||'error'};      // refused for good: keep it here, retry only if it changes
    addLog('var(--later)',`⚠ “${c.t}” couldn’t be shared (${(r&&r.error)||'error'})`);
  }
}
async function syncPull(){
  const r=await cloudRpc('td_cards_sync',{p_since:sync.since||'1970-01-01'});
  if(!r||!r.ok)throw new Error((r&&r.error)||'sync failed');
  let changed=false;
  for(const row of r.cards||[]){const k=sync.known[row.id];if(k&&k.v>=row.version)continue;if(applyServer(row,'pull'))changed=true}
  // The next pull starts 15 s before the server's clock, not at it: a write stamped just before this pull but
  // committed just after it would otherwise never be seen. Rows seen twice are skipped by version above.
  const t=Date.parse(String(r.now).replace(/(\.\d{3})\d+/,'$1'));sync.since=isNaN(t)?r.now:new Date(t-15000).toISOString();
  return changed;
}
// Take the server's copy of one card: replace ours in place (so an open card keeps its object), file it in the deck
// or the archive, and tell the person what just happened to it.
function applyServer(row,why){
  const j=canon(row.card),srv=JSON.parse(j);sync.known[row.id]={v:row.version,j};
  let c=cards.find(x=>x.id===row.id)||archive.find(x=>x.id===row.id);
  const before=c?{holder:c.holder,status:c.status,nudge:c.nudge&&c.nudge.at}:null;
  if(c&&canon(shared(c))===j)return false;
  if(c){for(const k of Object.keys(c))delete c[k];Object.assign(c,srv)}else c=srv;
  const done=c.status==='done'||c.status==='dropped';
  if(done){const i=cards.indexOf(c);if(i>=0)cards.splice(i,1);if(!archive.includes(c)){archive.unshift(c);if(archive.length>300)archive.length=300}}
  else{const i=archive.indexOf(c);if(i>=0)archive.splice(i,1);if(!cards.includes(c))cards.push(c)}
  const by=row.by&&row.by!==viewer?nm(row.by):null;
  if(!done&&c.holder===viewer&&(!before||before.holder!==viewer)){                 // it just landed in my deck
    fresh.add(c.id);
    const a=curAsg(c),from=isReturned(c)?c.doneBy:c.kind==='moment'?c.maker:c.sentBack||(a&&a.by!==viewer?a.by:c.maker);
    const msg=isReturned(c)?`${nm(from)} finished “${c.t}” · your review`:c.kind==='moment'?`💌 A moment from ${nm(from)}`:c.sentBack?`${nm(from)} sent “${c.t}” back`:`${nm(from)} handed you “${c.t}”`;
    addLog(isReturned(c)?'var(--do)':c.kind==='moment'?'var(--pink)':'var(--team)',msg);toast(msg);
  }else if(!done&&c.nudge&&c.holder===viewer&&(!before||before.nudge!==c.nudge.at)){addLog('var(--team)',`👋 ${nm(c.nudge.by)} nudged you about “${c.t}”`);toast(`${nm(c.nudge.by)} nudged you about “${c.t}”`)}
  else if(done&&before&&before.status!==c.status&&by)addLog(c.kind==='moment'?'var(--pink)':c.status==='done'?'var(--do)':'var(--muted)',c.kind==='moment'?`💌 ${by} got your moment`:c.status==='done'?`✓ ${by} closed “${c.t}”`:`${by} dropped “${c.t}”`);
  else if(before&&before.holder===viewer&&c.holder!==viewer&&by)addLog('var(--muted)',`${by} took “${c.t}” back`);
  else if(why==='stale')toast(`“${c.t}” changed on ${by?by+'’s':'another'} phone · showing the latest`);
  return true;
}

/* ---------- Streaks: forgiving on purpose ----------
   A day is "clean" when nothing was left overdue and nothing hit 3 stamps (adults),
   or every dealt chore got done (kids). Weekends never break a streak, and one miss
   every 7 days is forgiven as a pass day. */
function streakOf(n){
  let s=0,pass=null;
  for(let d=nowDay()-1;d>nowDay()-90;d--){
    const r=dayLog[n+'@'+d];
    if(r==null)break;
    if(r==='clean'){s++;continue}
    if(r==='skip'||r==='out')continue;
    if(pass==null||pass-d>=7){pass=d;continue}
    break;
  }
  return{n:s,pass:pass!=null&&nowDay()-pass<=7};
}
const dirtyCards=n=>cards.filter(c=>c.holder===n&&c.type==='task'&&c.kind!=='moment'&&c.dealt==null&&((c.due!=null&&c.due<=nowDay())||c.stamps.length>=DECIDE_AT));
function closeDays(from,to){ // adults: judge each finished day once, when the clock rolls past it
  for(let p=from;p<to;p++)parentKeys().forEach(n=>{const k=n+'@'+p;if(dayLog[k])return;
    const dirty=cards.some(c=>c.holder===n&&c.type==='task'&&c.kind!=='moment'&&c.dealt==null&&((c.due!=null&&c.due<=p)||c.stamps.length>=DECIDE_AT));
    dayLog[k]=dirty?(isWeekend(p)?'skip':'miss'):'clean'});
}
/* ---------- Points: effort, not count. Only chores a parent approved count. ---------- */
const weekStart=d=>d-((dow(d)+6)%7); // weeks run Monday to Sunday
const ptsIn=(k,a,b,ok=true)=>ledger.filter(l=>l.who===k&&!!l.ok===ok&&l.day>=a&&l.day<b).reduce((s,l)=>s+l.mins,0);
const GOALS=[['🍕','Pizza night'],['🎬','Kids pick the weekend movie'],['🍦','Ice cream run'],['🌙','Late bedtime Saturday']],GOAL_PTS=300;
function bestWeek(k){let b=0;const w0=weekStart(nowDay());for(let w=w0-7;w>w0-7*12;w-=7)b=Math.max(b,ptsIn(k,w,w+7));return b}

/* ---------- My day: private. Nobody else sees your numbers. ---------- */
function renderMyDay(){
  const el=$('myday'),n=viewer,t=nowDay(),st=stat(n),s=streakOf(n),risk=isParent(n)?dirtyCards(n):[];
  const days=Array.from({length:7},(_,k)=>t-6+k),done=days.map(d=>(stats[n+'@'+d]||{}).done||0),max=Math.max(3,...done);
  const wk=done.reduce((a,b)=>a+b,0),handed=days.reduce((a,d)=>a+((stats[n+'@'+d]||{}).handed||0),0),bi=done.indexOf(Math.max(...done));
  const open=el.open;
  el.innerHTML=`<summary><span class="m">🔥 <b>${s.n}</b> day clean slate</span><span class="m">✓ <b>${st.done}</b> done today</span><span class="mlock">🔒 Only you</span></summary>
    ${risk.length?`<div class="risk">Keep the streak alive today: ${risk.slice(0,3).map(c=>`${esc(c.t)} (${c.stamps.length>=DECIDE_AT?`put off ${c.stamps.length}×`:c.due<t?'overdue':'due today'})`).join(', ')}.</div>`:isParent(n)?`<div class="risk" style="color:var(--do)">Nothing overdue and nothing dodged. Today counts toward the streak.</div>`:''}
    <div class="wkbars">${days.map((d,i)=>`<div class="${dayLog[n+'@'+d]==='clean'?'clean':''}" title="${dayName(d)}: ${done[i]} done"><i style="height:${Math.max(3,done[i]/max*52)}px"></i>${shortDay(d).slice(0,2)}</div>`).join('')}</div>
    <div class="recap">Last 7 days: ${wk} done · ${handed} handed off${wk?` · best day ${dayName(days[bi])} (${done[bi]})`:''}. Gold outline = a clean-slate day.</div>`;
  el.open=open;
}

// Who a typed name means, for THIS viewer: every household member's name and first name, the labels this viewer
// uses ("mom", "dad", "gigi"), plus "me" and "the kids". Built from the people list, never hard-coded.
const DEMO_ALIASES={ash:'Ashley',mila:'Myla',cully:'Kuhlly',kuhlen:'Kuhlly',cullen:'Kuhlly',mom:'Shelie'}; // the sample family's nicknames (demo only)
function nameMap(){
  const m={me:'__me'};
  if(kidKeys().length){m['the kids']='__kids';m.kids='__kids'}
  for(const p of people)for(const raw of [p.n,p.display_name||'']){const n=raw.toLowerCase();if(!n)continue;if(!(n in m))m[n]=p.id;const first=n.split(/\s+/)[0];if(first&&!(first in m))m[first]=p.id;}
  if(mode==='demo')for(const[k,v]of Object.entries(DEMO_ALIASES))if(!(k in m))m[k]=v;
  return m;
}
const nameRx=(m,prefix)=>new RegExp(prefix+'('+Object.keys(m).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b'+(prefix.startsWith('^')?'[:,]?':''),'i');
const DOWRX='(?:sundays?|sun|mondays?|mon|tuesdays?|tues|tue|wednesdays?|weds|wed|thursdays?|thurs|thur|thu|fridays?|fri|saturdays?|sat)';
const dowOf=w=>({sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6})[w.toLowerCase().slice(0,3)];
const CHORE_RX=/\b(sweep|vacuum|dishes|dishwasher|trash|garbage|laundry|fold|feed|mow|rake|clean (your|the) room|make (your|the) bed|set the table|clear the table|wipe|dust|water the plants|filter|counters|mop)\b/i;
function parseLine(raw){
  let s=' '+raw.trim()+' ';
  const p={who:'__me',kind:null,repeat:null,at:null,due:null,title:''};
  const cut=(re,fn)=>{const m=s.match(re);if(m){fn(m);s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length)}return m};
  const NM=nameMap();
  cut(/^\s*tell\s+(\w+)\s+(to\s+|that\s+)?/i,m=>{p.kind='moment';p.who=NM[m[1].toLowerCase()]||'__me'});
  if(p.kind!=='moment'){
    cut(nameRx(NM,'^\\s*'),m=>{p.who=NM[m[1].toLowerCase()]});
    cut(nameRx(NM,'\\bfor '),m=>{p.who=NM[m[1].toLowerCase()]});
  }
  const today=nowDay();
  cut(/\bby (today|tonight|tomorrow|the (\d{1,2})(?:st|nd|rd|th)|(\w+day))\b/i,m=>{
    const w=m[1].toLowerCase();
    if(w==='today'||w==='tonight')p.due=today;else if(w==='tomorrow')p.due=today+1;
    else if(m[2]){const n=+m[2];for(let d=today;d<today+62;d++)if(dateOf(d).getDate()===n){p.due=d;break}}
    else if(dowOf(w)!=null){for(let d=today;d<today+8;d++)if(dow(d)===dowOf(w)){p.due=d;break}}
  });
  cut(/\bevery (\d+) months?\b/i,m=>{p.repeat={type:'monthly',dom:dateOf(today).getDate(),interval:+m[1]}});
  if(!p.repeat)cut(/\b(?:on )?the (\d{1,2})(?:st|nd|rd|th)(?: of (?:the|each|every) month)?(?: every month| each month| monthly)?\b/i,m=>{p.repeat={type:'monthly',dom:+m[1],interval:1}});
  if(!p.repeat)cut(/\b(monthly|every month|each month)\b/i,()=>{p.repeat={type:'monthly',dom:dateOf(today).getDate(),interval:1}});
  if(!p.repeat)cut(/\b(every ?day|daily|each day|every night|nightly)\b/i,()=>{p.repeat={type:'weekly',days:[0,1,2,3,4,5,6],interval:1}});
  if(!p.repeat)cut(/\b(?:every |on )?weekdays?\b/i,()=>{p.repeat={type:'weekly',days:[1,2,3,4,5],interval:1}});
  if(!p.repeat)cut(/\b(?:every |on )?weekends?\b/i,()=>{p.repeat={type:'weekly',days:[0,6],interval:1}});
  if(!p.repeat)cut(new RegExp('\\bevery other ('+DOWRX+'|week)\\b','i'),m=>{p.repeat={type:'weekly',days:[m[1].toLowerCase()==='week'?dow(today):dowOf(m[1])],interval:2}});
  if(!p.repeat)cut(/\b(weekly|every week|each week)\b/i,()=>{p.repeat={type:'weekly',days:[dow(today)],interval:1}});
  if(!p.repeat)cut(new RegExp('\\b(every|each|on)?\\s*('+DOWRX+'(?:\\s*(?:,|and|&|\\/)\\s*'+DOWRX+')*)\\b','i'),m=>{
    const days=[...m[2].matchAll(new RegExp(DOWRX,'gi'))].map(x=>dowOf(x[0]));
    const plural=/(day)s\b/i.test(m[2]);
    if((m[1]&&/every|each/i.test(m[1]))||plural||days.length>1)p.repeat={type:'weekly',days:[...new Set(days)],interval:1};
    else{for(let d=today;d<today+8;d++)if(dow(d)===days[0]){p.due=d;break}}
  });
  cut(/\bat (\d{1,2})(?::(\d\d))?\s*(am|pm|a|p)?\b/i,m=>{let h=+m[1];const mm=+(m[2]||0),ap=(m[3]||'').toLowerCase();
    if(ap.startsWith('p')&&h<12)h+=12;if(ap.startsWith('a')&&h===12)h=0;if(!ap&&h<7)h+=12;p.at=h*60+mm});
  cut(/\b(?:in the )?(morning|afternoon|evening|tonight|night|after school|before school|after dinner|before bed)\b/i,m=>{
    const w=m[1].toLowerCase();p.at=p.at??({morning:480,afternoon:840,evening:1140,tonight:1170,night:1170,'after school':960,'before school':420,'after dinner':1170,'before bed':1260})[w];
    if(w==='tonight'&&p.due==null&&!p.repeat)p.due=today});
  cut(/\btoday\b/i,()=>{if(p.due==null&&!p.repeat)p.due=today});

        items:c.items?c.items.map(i=>({t:i.t,done:false})):null});
      cards.push(nx);
      addLog('var(--do)',`🔁 Next “${c.t}”: ${dayName(d)}${d-nowDay()>6?', '+dateOf(d).toLocaleDateString([],{month:'short',day:'numeric'}):''}`);
    }
    if(!c.review&&c.kind!=='moment'&&!mine&&a!=='accept'){
      if(!deckOf(me).length){say('All clear. Enjoy the quiet. 🎉','clear');burst()}
      else if(c.stamps.length>=2)say('Finally off the deck. Nice.','finish');
      else if([3,5,8].includes(n))say(`That’s ${n} done ${tod()<720?'before lunch':'today'}.`,'milestone');
      else if(c.repeat&&c.dealt==null)say(`Done. Next one ${dayName(nextOcc(c.repeat,nowDay()+1))}.`,'info');
    }
    const sd=card.querySelector('.stamp.done');
    sd.animate([{opacity:0,transform:'translateX(-50%) rotate(-6deg) scale(2.6)'},{opacity:1,transform:'translateX(-50%) rotate(-6deg) scale(1)'}],{duration:240,easing:'cubic-bezier(.2,.8,.3,1.3)',fill:'forwards'});
    setTimeout(()=>tween(480,p=>{const s=p<.35?lerp(1,1.07,easeOut(p/.35)):lerp(1.07,.2,easeIn((p-.35)/.65));
      paint(card,{y:p<.35?0:lerp(0,-120,easeIn((p-.35)/.65)),s,op:p<.5?1:1-(p-.5)/.5})},finish),360);
  }
}

/* ---------- Do it: workspace with a quick path ---------- */
function quickPath(c){
  const q=c.qp?QP[c.qp]:null,et=errandTip(c,viewer);if(isReturned(c))return '';
  if(!q&&!et)return '';
  const links=(q&&q.links||[]).map(l=>`<a class="qlink" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><span>${esc(l.label)}<small>${esc(l.note)}</small></span><span aria-hidden="true">↗</span></a>`).join('');
  const ready=q&&q.ready?`<div><div class="sub" style="margin-bottom:5px">Have ready</div><div class="qready">${q.ready.map(r=>`<span>${esc(r)}</span>`).join('')}</div></div>`:'';
  const tips=[et,...(q&&q.tips||[])].filter(Boolean).map(t=>`<div class="qtip"><span>💡</span><span>${esc(t)}</span></div>`).join('');
  const ag=q&&q.agent?`<button type="button" class="qagent" id="qAgent">🤖 Park for ${esc(agentOf(viewer))} to ${esc(q.agent)}<small style="display:block;font-weight:500;color:var(--ink-soft)">${viewer===meKey()&&agentConnected()?'Not sent yet: only the handshake probe is wired up in this stage':`Not connected yet: it waits, unsent, until ${esc(agentOf(viewer))} is`}</small></button>`:'';
  return `<div class="qp"><div class="qph">⚡ Quick path</div>${links}${ready}${tips}${ag}</div>`;
}
function openWork(card,c){
  busy=true;
  overlay.className=`overlay ${c.kind}`;
  if(c.kind==='moment'){
    overlay.innerHTML=`<div class="sub">${c.maker!==viewer?`From ${esc(nm(c.maker))} · just for you`:'Moment'}</div>
      <h2>${esc(c.t)}</h2>${c.note?`<p>${esc(c.note)}</p>`:''}
      <div class="actions"><button type="button" class="primary" id="wDone">💌 Got it</button><button type="button" class="quiet" id="wClose">Not now</button></div>`;
    overlay.hidden=false;
    $('wDone').onclick=()=>{overlay.hidden=true;busy=false;commit(card,c,'done')};
    $('wClose').onclick=()=>{overlay.hidden=true;busy=false;render()};
    return;
  }
  if(c.review){
    overlay.innerHTML=`<div class="sub">Chore check · from ${esc(nm(c.doneBy))}</div><h2>${esc(c.t)}</h2>
      <p>${esc(nm(c.doneBy))} says it’s done. ${esc(c.note)}</p>
      <div class="actions"><button type="button" class="primary" id="wDone">👍 Thumbs-up</button><button type="button" class="quiet" id="wClose">Later</button></div>`;
    overlay.hidden=false;
    $('wDone').onclick=()=>{overlay.hidden=true;busy=false;commit(card,c,'done')};
    $('wClose').onclick=()=>{overlay.hidden=true;busy=false;render()};
    return;
  }
  const ret=isReturned(c),cur=curAsg(c),cloud=ret&&!!cur.cloudId;   // cloud: returned by Grok Bot; the server holds the result
  const tmw=asgTo(c,viewer);
  const from=!ret&&c.type==='task'&&c.dealt==null&&(tmw&&tmw.by!==viewer?tmw.by:c.maker!==viewer&&people.some(p=>p.id===c.maker)?c.maker:null);
  const draw=()=>{
    overlay.innerHTML=`<div class="sub">${esc(c.tag||'Task')} · ~${c.mins} min${c.repeat?' · 🔁 '+esc(repLabel(c.repeat)):''}${c.dealt!=null?' · 🎲 today’s deal':''}${from?` · from ${esc(nm(from))}`:''}${ret?` · done by ${esc(nm(cur.to))}`:''}</div>${ret||c.review?'':`<button type="button" class="editbtn" id="wEdit" aria-label="Edit this card">✎ Edit</button>`}
      <h2>${esc(c.t)}</h2>${c.note&&!cloud?`<p>${esc(c.note)}</p>`:''}
      ${cloud?cloudReview(c):quickPath(c)}
      ${c.items?`<ul class="check">${c.items.map((it,k)=>`<li class="${it.done?'x':''}"><button type="button" data-k="${k}"><span class="box">${it.done?'✓':''}</span><span class="t">${esc(it.t)}</span></button></li>`).join('')}</ul>
        <form class="add" id="addForm"><input id="addItem" placeholder="Add an item" autocomplete="off"><button type="submit" class="pbtn">Add</button></form>`
        :c.next&&!c.qp&&!ret?`<p>Next step: <b style="color:var(--ink)">${esc(c.next)}</b></p>`:''}
      <div class="actions">
        ${ret?`<button type="button" class="primary" id="wAccept">Accept ✓</button>${cloud?'':`<button type="button" class="warn" id="wAgain">Not quite: back to ${esc(nm(cur.to))}</button>`}`
          :`<button type="button" class="primary" id="wDone">${c.proof?'Done 📸':'Done ✓'}</button>`}
        ${from?`<button type="button" class="warn" id="wBack">Send it back to ${esc(nm(from))}</button>`:''}
        <button type="button" class="quiet" id="wClose">Not now</button>
      </div>`;
    overlay.querySelectorAll('.check button').forEach(b=>b.onclick=()=>{const it=c.items[+b.dataset.k];it.done=!it.done;touch(c);draw()});
    const we=$('wEdit');if(we)we.onclick=()=>openEdit(c,draw);wsRedraw=draw;
    const f=$('addForm');if(f)f.onsubmit=e=>{e.preventDefault();const v=$('addItem').value.trim();if(v){c.items.push({t:v,done:false});draw();$('addItem').focus()}};
    const qa=$('qAgent');if(qa)qa.onclick=()=>{overlay.hidden=true;busy=false;commit(card,c,'agent')};
    if(ret){$('wAccept').onclick=async()=>{
        if(cloud){ // the server's acceptance is the real one; the local card follows it
          const b=$('wAccept');b.disabled=true;b.textContent='Accepting…';
          try{const r=await cloudOp('accept',{assignment_id:cur.cloudId,expected_version:c.cloud&&c.cloud.version});if(c.cloud){c.cloud.state='accepted';c.cloud.version=(r.assignment&&r.assignment.version)||c.cloud.version}}
          catch(e){const code=e.body&&e.body.error;
            if(code==='version_conflict'||code==='not_returned'){try{await syncProbe()}catch(x){}if(isReturned(c)){draw();toast('It changed on the server. Take another look.')}else{overlay.hidden=true;busy=false;render();toast('It changed on the server.')}return}
            b.disabled=false;b.textContent='Accept ✓';toast(e.message==='sign_in_required'?'Signed out. Sign in again.':'Couldn’t reach the server. Try again.');return}
        }
        overlay.hidden=true;busy=false;commit(card,c,'accept');if(cloud)undoRec=null; // accepted on the server: not undoable here
      };
      const wa=$('wAgain');if(wa)wa.onclick=()=>{overlay.hidden=true;busy=false;commit(card,c,'team',cur.to)}}
    else $('wDone').onclick=()=>{if(c.proof)return proveIt(card,c);overlay.hidden=true;busy=false;commit(card,c,'done')};
    if(from)$('wBack').onclick=()=>{overlay.hidden=true;busy=false;commit(card,c,'team',from)};
    $('wClose').onclick=()=>{overlay.hidden=true;busy=false;render()};
  };
  draw();overlay.hidden=false;
}
/* Edit: change what the card says and when it's possible. One sheet, opened from the workspace. */
const MIN_OPTS=[5,10,15,20,30,45,60,90];
function openEdit(c,back){
  const t=nowDay(),moment=c.kind==='moment';
  const dueOpts=[['','No due date'],...Array.from({length:14},(_,k)=>[String(t+k),k===0?'Today':k===1?'Tomorrow':dayName(t+k)+' '+dateOf(t+k).toLocaleDateString([],{month:'short',day:'numeric'})])];
  if(c.due!=null&&(c.due<t||c.due>=t+14))dueOpts.splice(1,0,[String(c.due),c.due<t?'Overdue: '+dayName(c.due):dateOf(c.due).toLocaleDateString()]);
  const rk=repKey(c.repeat)||'',repOpts=[['','Once'],['daily','Every day'],['weekdays','Weekdays'],['weekly',`Every ${DOW_NAMES[dow(t)]}`],['other',`Every other ${DOW_NAMES[dow(t)]}`],['monthly',`The ${dateOf(t).getDate()}${'th'} of each month`]];
  let mins=c.mins,rule=c.rule,kind=c.kind;
  let draw=()=>{
    overlay.innerHTML=`<div class="sub">Edit card</div><form class="ef" id="ef" autocomplete="off">
      <label>Title<input id="eT" value="${esc(c.t)}" required maxlength="120"></label>
      <label>Note<textarea id="eN" maxlength="500">${esc(c.note||'')}</textarea></label>
      ${moment?'':`<div class="ef"><label style="margin:0">About how long</label><div class="pills" id="eM">${MIN_OPTS.map(m=>`<button type="button" data-m="${m}" aria-pressed="${m===mins}">${m<60?m+' min':m/60+' hr'}</button>`).join('')}</div></div>
      <div class="row2"><label>Due<select id="eD">${dueOpts.map(([v,l])=>`<option value="${v}"${v===(c.due==null?'':String(c.due))?' selected':''}>${esc(l)}</option>`).join('')}</select></label>
        <label>Repeats<select id="eR">${repOpts.map(([v,l])=>`<option value="${v}"${v===rk?' selected':''}>${esc(l)}</option>`).join('')}</select></label></div>
      <div class="ef"><label style="margin:0">When it’s possible</label><div class="pills" id="eW">${Object.entries(RULES).map(([k,r])=>`<button type="button" data-w="${k}" aria-pressed="${k===rule}">${esc(r.lbl)}</button>`).join('')}</div></div>
      <div class="ef"><label style="margin:0">Kind</label><div class="pills" id="eK">${[['task','Task'],['chore','Chore 🔁']].map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===kind}">${l}</button>`).join('')}</div></div>`}
      <div class="actions"><button type="submit" class="primary">Save</button><button type="button" class="quiet" id="eX">Cancel</button></div></form>`;
    overlay.querySelectorAll('#eM button').forEach(b=>b.onclick=()=>{mins=+b.dataset.m;keep();draw()});
    overlay.querySelectorAll('#eW button').forEach(b=>b.onclick=()=>{rule=b.dataset.w;keep();draw()});
    overlay.querySelectorAll('#eK button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;keep();draw()});
    $('eX').onclick=back;
    $('ef').onsubmit=e=>{e.preventDefault();saveEdit()};
    $('eT').focus();
  };
  // keep typed text when a pill redraws the form
  let draft=null;const keep=()=>{draft={t:$('eT').value,n:$('eN').value,d:$('eD')?.value,r:$('eR')?.value}};
  const origDraw=draw;
  const drawKeep=()=>{origDraw();if(draft){$('eT').value=draft.t;$('eN').value=draft.n;if($('eD'))$('eD').value=draft.d;if($('eR'))$('eR').value=draft.r}};
  const saveEdit=()=>{
    const title=$('eT').value.trim();if(!title){$('eT').focus();return}
    snapUndo(c,'edit','Edited: '+title);
    c.t=title;c.note=$('eN').value.trim();
    if(!moment){
      c.mins=mins;c.rule=rule;c.kind=kind;c.tag=kind==='chore'?'Chore':(c.tag==='Chore'?'Task':c.tag);
      const d=$('eD').value;c.due=d===''?null:+d;
      const r=$('eR').value,was=repKey(c.repeat)||'';
      if(r!==was)c.repeat=r?{...repFromKey(r),at:c.repeat?.at??(isKid(c.holder)?960:1140),start:t}:null;
    }
    touch(c);addLog('var(--muted)',`${nm(viewer)} edited “${c.t}”`);
    save();back();showUndo();
  };
  draw=drawKeep;draw();
}
function proveIt(card,c){
  let url=null;
  overlay.innerHTML=`<div class="sub">${esc(c.t)}</div><h2>Prove it 📸</h2>
    <p>Snap a photo of the finished job. It goes to Mom and Dad for a thumbs-up, then it’s deleted.</p>
    <label class="cam"><input type="file" accept="image/*" capture="environment" id="proof" aria-label="Take a photo"><span id="camTxt">📷 Tap to take the photo</span></label>
    <div class="actions"><button type="button" class="primary" id="pSend" disabled>Send for a thumbs-up</button><button type="button" class="quiet" id="pBack">Back</button></div>`;
  $('proof').onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);
    $('camTxt').outerHTML=`<img src="${url}" alt="Your photo">`;$('pSend').disabled=false;
  };
  $('pSend').onclick=()=>{if(url)URL.revokeObjectURL(url);overlay.hidden=true;busy=false;commit(card,c,'done',{photo:true})};
  $('pBack').onclick=()=>{if(url)URL.revokeObjectURL(url);openWork(card,c)};
}
function openDecide(card,c){
  busy=true;overlay.className=`overlay ${c.kind}`;
  overlay.innerHTML=`<div class="sub">Put off ${c.stamps.length} times · ${c.stamps.join(' ')}</div>
    <h2>This one keeps coming back. Let’s decide.</h2><p>“${esc(c.t)}” · ~${c.mins} min</p>
    <div class="decide-grid">
      <button type="button" class="primary" id="dDo">Do it now<small>Open it up</small></button>
      <button type="button" id="dHand">Hand it off<small>Swipe up after this</small></button>
      <button type="button" id="dAgent">Park for ${esc(agentOf(viewer))}<small>${viewer===meKey()&&agentConnected()?'Not sent: only the probe is wired up yet':'Not sent: not connected yet'}</small></button>
      <button type="button" id="dDrop">Let it go<small>Off the deck</small></button>
    </div>
    <div class="actions"><button type="button" class="quiet" id="dClose">Back to the deck</button></div>`;
  overlay.hidden=false;
  const close=()=>{overlay.hidden=true;busy=false};
  $('dDo').onclick=()=>{close();openWork(card,c)};
  $('dAgent').onclick=()=>{close();commit(card,c,'agent')};
  $('dDrop').onclick=()=>{close();commit(card,c,'drop')};
  $('dHand').onclick=()=>{close();const h=$('hint');h.textContent='Swipe up and aim at someone';h.classList.add('flash');
    setTimeout(()=>{h.textContent='Swipe right and the app finds a time';h.classList.remove('flash')},3500)};
  $('dClose').onclick=close;
}

/* ---------- Time moves ---------- */
function advance(to){
  const prevDay=nowDay(),prev=stat(viewer);
  now=to;
  if(nowDay()>prevDay)closeDays(prevDay,nowDay());
  const woke=cards.filter(c=>c.slot&&c.slot.day*DAY+c.slot.start<=now);
  woke.forEach(c=>{c.slot=null;c.status='open';touch(c);fresh.add(c.id)});
  addLog('var(--later)',`It’s ${nowDay()>prevDay?dayName(nowDay())+' ':''}${fmt(now)}. ${woke.length?`${woke.length} card${woke.length>1?'s':''} came back.`:'Nothing was waiting.'}`);
  runDeals();
  if(nowDay()>prevDay){if(prev.done>=3)say(`Yesterday: ${prev.done} done, ${prev.handed} handed off. Solid day.`,'recap')}
  render();
}
$('skipHour').onclick=()=>{if(!busy)advance(now+60)};
$('skipDay').onclick=()=>{if(!busy)advance((nowDay()+1)*DAY+WAKE)};
$('reset').onclick=()=>{if(busy||mode!=='demo')return;try{localStorage.removeItem(STORE)}catch(e){}seed();lastKind='';closeWait();runDeals();render();renderLog()};
$('team').addEventListener('click',e=>{
  const b=e.target.closest('.who');if(!b||busy)return;
  if(mode==='family'){if(b.dataset.n!==viewer)toast(`Swipe a card up to hand it to ${nm(b.dataset.n)}`);return}  // you are who you signed in as
  viewer=b.dataset.n;closeWait();
  const back=deckOf(viewer).find(c=>fresh.has(c.id)&&isReturned(c));
  render();
  if(back)say(`${curAsg(back).to} finished “${back.t}”. Your review ✓`,'handled');
});
window.addEventListener('resize',()=>applyShapes(deck));
document.addEventListener('keydown',e=>{
  if(busy||mode==='welcome'||mode==='join'||!$('waitLayer').hidden||!$('cloudLayer').hidden||!$('famLayer').hidden||(e.target.closest&&e.target.closest('input,textarea,button')))return;
  const top=deck.querySelector('.card:last-child'),c=deckOf(viewer)[0];if(!top||!c)return;
  if(e.key==='ArrowLeft')openWork(top,c);
  if(e.key==='ArrowRight')notNow(top,c);
  if(e.key==='ArrowDown'&&c.kind!=='moment')commit(top,c,'agent');
});
boot();
</script>
